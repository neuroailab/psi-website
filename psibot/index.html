<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f8f5" />
    <meta name="description" content="PSI Bot. Coming soon from the Stanford NeuroAI Lab." />
    <meta property="og:title" content="PSI Bot" />
    <meta property="og:description" content="Coming soon from the Stanford NeuroAI Lab." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://neuroailab.github.io/psi-website/psibot/" />
    <link rel="canonical" href="https://neuroailab.github.io/psi-website/psibot/" />
    <link rel="icon" href="psi-mark.svg" type="image/svg+xml" />
    <title>PSI Bot — Stanford NeuroAI Lab</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f8f8f5;
        --ink: #191b1b;
        --muted: #626762;
        --line: #dedfd8;
        --accent: #245cd6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 280px;
        background: var(--paper);
        color: var(--ink);
      }
      a { color: inherit; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 7px; }
      .page {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
        min-height: 100svh;
        max-width: 1600px;
        margin-inline: auto;
        padding: 32px 48px 28px;
      }
      .topline, .bottomline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        font-size: 12px;
        line-height: 1.5;
      }
      .wordmark { font-weight: 650; letter-spacing: .18em; }
      .lab { color: var(--muted); }
      .lab:hover, .explore:hover { color: var(--accent); }
      main {
        display: grid;
        justify-items: center;
        align-content: center;
        padding-block: 80px 100px;
        text-align: center;
      }
      .symbol { width: 148px; height: 172px; margin-bottom: 46px; }
      h1 { margin: 0; font-size: clamp(42px, 7vw, 62px); font-weight: 500; letter-spacing: -.055em; line-height: 1.08; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 23px 0 0;
        color: var(--muted);
        font-size: 14px;
        letter-spacing: .015em;
      }
      .status::before { content: ""; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
      .bottomline { border-top: 1px solid var(--line); padding-top: 22px; color: var(--muted); }
      .explore { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); }
      .explore svg { width: 14px; height: 14px; }
      @media (max-width: 600px) {
        .page { padding: 24px 24px 22px; }
        .topline, .bottomline { font-size: 11px; gap: 16px; }
        .symbol { width: 120px; height: 140px; margin-bottom: 38px; }
        main { padding-block: 70px 85px; }
        .bottomline { align-items: flex-end; }
      }
      @media (max-height: 570px) and (min-width: 601px) {
        main { padding-block: 32px; }
        .symbol { width: 90px; height: 104px; margin-bottom: 20px; }
        h1 { font-size: 40px; }
        .status { margin-top: 15px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topline">
        <a class="wordmark" href="https://neuroailab.github.io/psi-website/" aria-label="PSI home">PSI</a>
        <a class="lab" href="https://neuroailab.stanford.edu/">Stanford NeuroAI Lab</a>
      </header>
      <main>
        <svg class="symbol" viewBox="0 0 120 140" fill="none" aria-hidden="true">
          <path d="M24 27V56C24 78 37 91 60 91C83 91 96 78 96 56V27M60 14V125" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <h1>PSI Bot</h1>
        <p class="status">Coming soon.</p>
      </main>
      <footer class="bottomline">
        <span>Probabilistic Structure Integration</span>
        <a class="explore" href="https://neuroailab.github.io/psi-website/">
          Explore PSI
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8H13M8 3L13 8L8 13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </a>
      </footer>
    </div>
  </body>
</html>
